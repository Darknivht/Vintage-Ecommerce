{% extends 'partials/base.html' %}
{% load static %}

{% block content %}
<div class="gray py-3">
  <div class="container">
    <div class="row">
      <div class="colxl-12 col-lg-12 col-md-12">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'store:shop' %}">Shop</a></li>
            <li class="breadcrumb-item active" aria-current="page">Select Category</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>

<section class="middle">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="sec_title position-relative text-center">
          <h2 class="off_title">Select a Category</h2>
          <h3 class="ft-bold pt-3">Choose a category for your product</h3>
        </div>
      </div>
    </div>
    
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8 col-md-10 col-sm-12">
        <div class="card">
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="form-group">
                <label for="category-select">Category</label>
                {{ form.category }}
              </div>
              <div class="form-group mt-4 text-center">
                <button type="submit" class="btn btn-primary">Continue</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
